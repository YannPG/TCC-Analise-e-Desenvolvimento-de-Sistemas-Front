<div class="dialog-overlay">
  <div class="dialog-card">
    
    <header class="dialog-header">
      <h2>{{ isEdicao ? 'Editar Atividade' : 'Registrar Atividade' }}</h2>
      <button class="btn-close" (click)="cancelar()">
        <i class="ph ph-x"></i>
      </button>
    </header>

    <div class="dialog-body">
      <div class="alert-error" *ngIf="erroValidacao">
        <i class="ph ph-warning-circle"></i> {{ erroValidacao }}
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Data e Hora *</label>
          <input type="datetime-local" [(ngModel)]="dadosAtividade.dataAtividade">
        </div>
        <div class="form-group">
          <label>Status *</label>
          <select [(ngModel)]="dadosAtividade.status">
            <option value="AGENDADA">Agendada</option>
            <option value="EM_ANDAMENTO">Em Andamento</option>
            <option value="CONCLUIDA">Concluída</option>
            <option value="CANCELADA">Cancelada</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tipo de Atividade *</label>
          <div style="display: flex; gap: 8px;">
            <select [(ngModel)]="dadosAtividade.tipoAtividadeId" style="flex: 1;">
              <option [ngValue]="null">Selecione...</option>
              <option *ngFor="let tipo of tiposAtividade" [ngValue]="tipo.id">
                {{ tipo.nome }}
              </option>
            </select>
            
            <button type="button" class="btn-primary" (click)="abrirModalNovoTipo()" title="Adicionar Novo Tipo" style="padding: 0 14px;">
              <i class="ph ph-plus"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Setor *</label>
          <select [(ngModel)]="dadosAtividade.setorId">
            <option [ngValue]="null">Selecione...</option>
            <option *ngFor="let setor of setores" [ngValue]="setor.id">
              {{ setor.nome }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Responsável *</label>
          <select [(ngModel)]="dadosAtividade.responsavelId">
            <option [ngValue]="null">Selecione...</option>
            <option *ngFor="let func of funcionarios" [ngValue]="func.id">
              {{ func.nomeCompleto }}
            </option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Equipamento Utilizado</label>
          <select [(ngModel)]="dadosAtividade.equipamentoId">
            <option [ngValue]="null">Nenhum equipamento</option>
            <option *ngFor="let eqp of equipamentos" [ngValue]="eqp.id">
              {{ eqp.nome }} ({{ eqp.marcaModelo || 'Sem marca' }})
            </option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Descrição / Observações *</label>
        <textarea [(ngModel)]="dadosAtividade.descricao" rows="2" placeholder="Detalhes da operação..."></textarea>
      </div>
    </div>

    <footer class="dialog-actions">
      <button class="btn-outline" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
        {{ carregando ? 'Salvando...' : 'Salvar' }}
      </button>
    </footer>

  </div>
</div>

<app-registrar-tipo-dialog
  *ngIf="mostrarModalTipo"
  (fechar)="mostrarModalTipo = false"
  (salvo)="onTipoCriado($event)">
</app-registrar-tipo-dialog>
