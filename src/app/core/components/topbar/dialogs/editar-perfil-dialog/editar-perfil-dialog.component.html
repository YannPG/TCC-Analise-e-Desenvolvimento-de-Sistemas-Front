<div class="dialog-overlay">
  <div class="dialog-card">
    
    <header class="dialog-header">
      <h2>Editar Perfil</h2>
      <button class="btn-close" (click)="cancelar()">
        <i class="ph ph-x"></i>
      </button>
    </header>

    <div class="dialog-body">
      <div class="alert-error" *ngIf="erroValidacao">
        <i class="ph ph-warning-circle"></i> {{ erroValidacao }}
      </div>

      <div class="form-row">
        <div class="form-group flex-2">
          <label>Nome Completo *</label>
          <input type="text" [(ngModel)]="dadosEdicao.nomeCompleto">
        </div>
        
        <div class="form-group">
          <label>Nome de Usuário *</label>
          <input type="text" [(ngModel)]="dadosEdicao.nomeUsuario">
        </div>
      </div>

      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" [(ngModel)]="dadosEdicao.email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>CPF</label>
          <input 
            type="text" 
            [(ngModel)]="dadosEdicao.cpf" 
            (ngModelChange)="onCpfChange($event)"
            maxlength="14"
            placeholder="000.000.000-00">
        </div>

        <div class="form-row">
        <div class="form-group">
          <label>Nova Senha (opcional)</label>
          <input type="password" [(ngModel)]="dadosEdicao.senha" placeholder="Deixe em branco para manter">
        </div>

        <div class="form-group">
          <label>Confirmar Senha</label>
          <input type="password" [(ngModel)]="dadosEdicao.confirmarSenha" placeholder="Repita a senha">
        </div>
      </div>
      </div>
    </div>

    <footer class="dialog-actions">
      <button class="btn-outline" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="confirmar()">Salvar Alterações</button>
    </footer>

  </div>
</div>
