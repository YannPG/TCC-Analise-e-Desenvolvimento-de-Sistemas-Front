<div class="dialog-overlay">
  <div class="dialog-card">
    
    <header class="dialog-header">
      <h2>Nova Propriedade</h2>
      <button class="btn-close" (click)="cancelar()">
        <i class="ph ph-x"></i>
      </button>
    </header>

    <div class="dialog-body">

       <div class="alert-error" *ngIf="erroValidacao">
          <i class="ph ph-warning-circle"></i> {{ erroValidacao }}
      </div>
      <div class="form-group">
        <label>Nome da Propriedade *</label>
        <input type="text" [(ngModel)]="novaPropriedade.nome" placeholder="Ex: Fazenda Boa Esperança">
      </div>

      <div class="form-group">
        <label>Endereço / Logradouro</label>
        <input type="text" [(ngModel)]="novaPropriedade.endereco" placeholder="Ex: Rodovia SP 333, Km 40">
      </div>

      <div class="form-row">
        <div class="form-group flex-2">
          <label>Município *</label>
          <input type="text" [(ngModel)]="novaPropriedade.municipio" placeholder="Ex: Assis">
        </div>
        <div class="form-group">
          <label>UF *</label>
          <input type="text" [(ngModel)]="novaPropriedade.uf" maxlength="2" placeholder="SP">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-2">
          <label>CPF / CNPJ (Opcional)</label>
          <input 
            type="text" 
            [(ngModel)]="novaPropriedade.cnpj" 
            (ngModelChange)="onDocumentoChange($event)"
            maxlength="18"
            placeholder="000.000.000-00 ou 00.000.000/0000-00">
        </div>
        <div class="form-group">
          <label>CEP</label>
          <input 
            type="text" 
            [(ngModel)]="novaPropriedade.cep" 
            (ngModelChange)="onCepChange($event)"
            maxlength="9"
            placeholder="00000-000">
        </div>
      </div>
    </div>

    <footer class="dialog-actions">
      <button class="btn-outline" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="confirmar()">Registrar</button>
    </footer>

  </div>
</div>
