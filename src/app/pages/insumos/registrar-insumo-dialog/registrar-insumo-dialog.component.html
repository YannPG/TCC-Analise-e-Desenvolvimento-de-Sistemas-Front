<div class="dialog-overlay">
  <div class="dialog-card">
    <header class="dialog-header">
      <h2>{{ isEdicao ? 'Editar Insumo' : 'Adicionar Insumo' }}</h2>
      <button class="btn-close" (click)="cancelar()"><i class="ph ph-x"></i></button>
    </header>

    <div class="dialog-body">
      <div class="alert-error" *ngIf="erroValidacao">
        <i class="ph ph-warning-circle"></i> {{ erroValidacao }}
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label>Nome do Insumo *</label>
          <input type="text" [(ngModel)]="dadosInsumo.nome" placeholder="Ex: Sementes de Milho Híbrido">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Categoria *</label>
          <select [(ngModel)]="dadosInsumo.categoria">
            <option value="FERTILIZANTE">Fertilizante</option>
            <option value="SEMENTE">Semente</option>
            <option value="DEFENSIVO">Defensivo</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label>Qtd. em Estoque *</label>
          <input type="number" step="0.01" [(ngModel)]="dadosInsumo.quantidadeEstoque">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Unidade *</label>
          <select [(ngModel)]="dadosInsumo.unidadeMedida">
            <option value="LITROS">Litros (L)</option>
            <option value="KG">Quilogramas (Kg)</option>
            <option value="SACOS">Sacos</option>
            <option value="UNIDADE">Unidade (Un)</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
        <div class="form-group" style="flex: 2;">
          <label>Fornecedor</label>
          <input type="text" [(ngModel)]="dadosInsumo.fornecedor" placeholder="Ex: Agrícola XYZ">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Descrição detalhada</label>
          <textarea [(ngModel)]="dadosInsumo.descricao" placeholder="Detalhes adicionais sobre o insumo..." rows="2"></textarea>
        </div>
      </div>
    </div>

    <footer class="dialog-actions">
      <button class="btn-outline" (click)="cancelar()">Cancelar</button>
      <button class="btn-primary" (click)="confirmar()" [disabled]="carregando">
        {{ carregando ? 'Salvando...' : 'Salvar' }}
      </button>
    </footer>
  </div>
</div>
